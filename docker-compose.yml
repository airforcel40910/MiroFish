services:
  mirofish:
    # 从仓库内 Dockerfile 本地构建（支持 linux/arm64，如 Apple silicon）
    build:
      context: .
      dockerfile: Dockerfile
    image: mirofish:local
    # 上游预构建镜像（不再使用）：
    # image: ghcr.io/666ghj/mirofish:latest
    # 加速镜像（如拉取缓慢可替换上方地址）
    # image: ghcr.nju.edu.cn/666ghj/mirofish:latest
    container_name: mirofish
    env_file:
      - .env
    # 仅绑定宿主机回环地址，局域网无法访问；容器内服务仍监听 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
